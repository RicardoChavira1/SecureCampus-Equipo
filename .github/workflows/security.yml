name: SecureCampus LAB-006

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Werkzeug pytest pip-audit

      - name: Run pytest
        run: |
          python -m pytest tests/ -v

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt || true
